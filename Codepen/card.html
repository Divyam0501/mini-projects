<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>
  <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#96b7ec;
}

.card{
    width:350px;
    padding:25px;
    border-radius:20px;

    background:linear-gradient(
        135deg,
        #1d1b1b,
        #463f3f
    );

    text-align:center;

    box-shadow:
    0 0 25px rgba(0,0,0,0.9);
}

.image-box{
    width:100%;
    height:300px;
    background:white;
    border-radius:25px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.image-box img{
    width:92%;
    /* object-fit:contain; */

    transition:.4s;
}

.card:hover img{
    transform:translateY(-10px) scale(1.3);
}

h2{
    margin-top:18px;
    color:white;
    font-size:28px;
    font-weight:900;
    /* letter-spacing:1px; */
    /* text-transform:uppercase; */
}

.coming-soon{
    display:inline-block;
    margin-top:10px;

    background:#e5ff00;
    color:black;

    padding:5px 10px;

    font-weight:bold;
    font-size:14px;
}

.btn-container{
    margin-top:25px;

    display:flex;
    justify-content:space-between;
    gap:15px;
}

button{
    flex:1;

    background:#111;
    color:white;

    border:3px solid #00aaff;
    border-radius:15px;

    padding:12px 0px;

    font-size:18px;
    font-weight:900;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#00aaff;
    color:black;

    box-shadow:
    0 0 15px #00aaff;
}
  </style>
</head>
<body>
     <div class="card">

        <div class="image-box">
            <img src="/Codepen/5324c8eNike-DQ8426-002_1.avif" alt="Shoe">
        </div>

        <h2>FUTURISTIC HC SHOE</h2>

        <span class="coming-soon">COMING SOON</span>

        <div class="btn-container">
            <button>BUY NOW</button>
            <button>ADD TO CART</button>
        </div>

    </div>

</body>
</html>
