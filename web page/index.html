<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Layout</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .carousel-item img {
      height: 300px;
      object-fit: cover;
    }

    footer {
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://picsum.photos/id/1015/1200/400" class="d-block w-100" alt="Image 1">
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/id/1016/1200/400" class="d-block w-100" alt="Image 2">
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/id/1018/1200/400" class="d-block w-100" alt="Image 3">
      </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

  <div class="container py-5">

    <div class="row g-4">

      <div class="col-md-4">
        <div class="card h-100 shadow">
          <img src="https://picsum.photos/id/1025/400/250" class="card-img-top" alt="Card Image">

          <div class="card-body text-center">
            <h5 class="card-title">Card One</h5>
            <p class="card-text">
              Sample description for card one.
            </p>

            <a href="https://www.google.com" class="btn btn-primary" target="_blank">
              Visit Link
            </a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow">
          <img src="https://picsum.photos/id/1035/400/250" class="card-img-top" alt="Card Image">

          <div class="card-body text-center">
            <h5 class="card-title">Card Two</h5>
            <p class="card-text">
              Sample description for card two.
            </p>

            <a href="https://www.github.com" class="btn btn-success" target="_blank">
              Visit Link
            </a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow">
          <img src="https://picsum.photos/id/1040/400/250" class="card-img-top" alt="Card Image">

          <div class="card-body text-center">
            <h5 class="card-title">Card Three</h5>
            <p class="card-text">
              Sample description for card three.
            </p>

            <a href="https://www.linkedin.com" class="btn btn-danger" target="_blank">
              Visit Link
            </a>
          </div>
        </div>
      </div>

    </div>

  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">
      © 2026 All Rights Reserved. Unauthorized reproduction or copyright infringement is prohibited.
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
